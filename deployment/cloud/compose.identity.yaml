services:
  identity-db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["identity_db:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
  identity:
    image: ${KEYCLOAK_IMAGE:?Set an approved Keycloak image pinned by digest}
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${IDENTITY_DOMAIN:?Set IDENTITY_DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set admin username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set admin password}
    volumes: ["./realm.json:/opt/keycloak/data/import/workswarm-realm.json:ro"]
    networks: [backend]
    depends_on:
      identity-db:
        condition: service_healthy
volumes:
  identity_db:
