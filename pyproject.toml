[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workswarm-auth"
version = "0.7.2"
description = "WorkSwarm third-party OAuth connector: Gmail, Google Drive/Calendar, GitHub, Microsoft and Slack with verified account binding"
requires-python = ">=3.11"
dependencies = [
  "httpx[socks]>=0.27,<1", "cryptography>=43",
  "mcp>=1.30,<2", "PyJWT[crypto]>=2.10,<3"
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
workswarm-auth = "workswarm_auth.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
